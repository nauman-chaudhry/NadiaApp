services:
  # ── API web service ──────────────────────────────────────────────────────────
  - type: web
    name: nadia-api
    runtime: node
    rootDir: backend
    buildCommand: npm install && npm run build && npm run migrate:prod
    startCommand: npm run start:api
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: LOG_LEVEL
        value: info
      - key: ENABLE_CRON
        value: "false"
      # Set these in the Render dashboard — do NOT commit real values:
      - key: DATABASE_URL
        sync: false
      - key: TABOOLA_CLIENT_ID
        sync: false
      - key: TABOOLA_CLIENT_SECRET
        sync: false
      - key: TABOOLA_ACCOUNT_ID
        sync: false
      - key: CODEFUEL_CLIENT_ID
        sync: false
      - key: CODEFUEL_CLIENT_SECRET
        sync: false
      - key: CORS_ORIGIN
        sync: false   # set to your Vercel URL, e.g. https://nadia-dashboard.vercel.app
      # API auth (2026-09-24): the API verifies the dashboard's Supabase session
      # token against THIS deployment's Auth project. Production refuses to start
      # without these. Same project as the frontend's NEXT_PUBLIC_SUPABASE_*.
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false

  # ── Cron worker (background service) ────────────────────────────────────────
  - type: worker
    name: nadia-worker
    runtime: node
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: npm run start:worker
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: LOG_LEVEL
        value: info
      - key: ENABLE_CRON
        value: "true"
      - key: DATABASE_URL
        sync: false
      - key: TABOOLA_CLIENT_ID
        sync: false
      - key: TABOOLA_CLIENT_SECRET
        sync: false
      - key: TABOOLA_ACCOUNT_ID
        sync: false
      - key: CODEFUEL_CLIENT_ID
        sync: false
      - key: CODEFUEL_CLIENT_SECRET
        sync: false
      - key: DDC_REPORTING_URL
        sync: false
      - key: DDC_USERNAME
        sync: false
      - key: DDC_PASSWORD
        sync: false
      - key: DDC_HOURLY_API_BASE
        sync: false
      - key: DDC_HOURLY_AUTH_CODE
        sync: false
      # Daily client report email (Resend). REPORT_EMAIL_FROM must use a domain
      # verified on the Resend account or delivery is restricted to the account
      # owner's address.
      - key: RESEND_API_KEY
        sync: false
      - key: REPORT_EMAIL_FROM
        sync: false
      - key: REPORT_EMAIL_TO
        sync: false
      # Tenancy — see docs/plans/joe-dashboard.md and src/config/tenant.ts.
      # The partner credentials are shared between clients and return EVERY
      # account, so each worker must say which accounts are its own.
      #   Nadia (this blueprint):  ENABLED_SOURCES = all five
      #                            TENANT_ACCOUNT_EXCLUDE = ^SBH_rev_|Revlogic Media
      #   Joe (separate services, created in the Render dashboard, own Supabase):
      #                            ENABLED_SOURCES = taboola,outbrain,image_advantage
      #                            TENANT_ACCOUNT_INCLUDE = ^SBH_rev_|Revlogic Media
      #                            TABOOLA_ACCOUNT_ID = revlogicmedia4945-network
      #                            TENANT_IA_AFFILIATE_EXCLUDE = ^ssm\.
      #   Nadia additionally:      TENANT_IA_AFFILIATE_INCLUDE = ^ssm\.
      - key: ENABLED_SOURCES
        value: taboola,outbrain,codefuel,image_advantage,ddc
      - key: TENANT_ACCOUNT_EXCLUDE
        sync: false
      - key: TENANT_IA_AFFILIATE_INCLUDE
        sync: false
